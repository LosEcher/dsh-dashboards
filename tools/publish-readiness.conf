# publish-readiness 配置（每个仓一份，随仓发布）
#
# 放法: <repo>/tools/publish-readiness.conf
# 引擎: <repo>/tools/publish-readiness.sh（本文件与引擎同目录时自动被加载）
# 全部键都有缺省值；只需写你要覆盖的。
# 值按 shell 规则写（可含空格，需要时加引号）。

# ── 仓的定位 ────────────────────────────────────────────────
# 0 = 本仓声明为内部仓/非发布目标：门禁整体记 na 并 exit 0。
#     这不是"假装通过"，是"声明判据不适用"——避免永久红的门禁被训练成忽略。
#     转为对外时改回 1，门禁立刻开始咬。
PUBLISH_TARGET=1

# 人类可读描述（只用于输出，可留空）
REPO_DESC="DSH 看板插件：los 用量/节点矩阵 + macOS 原生探针 + 服务探活"

# ── P0-3 发布面 ─────────────────────────────────────────────
# 1 = 必须有 git remote（无远端的仓发布不了，身份也无从证明）
EXPECT_REMOTE=1

# any | public | private —— 声明期望值；any 则不做可见性检查
# 需要本机装了 gh 并已 gh auth login
EXPECT_VISIBILITY=public

# ── P0-4 身份面 ─────────────────────────────────────────────
# degraded = 脚本/插件仓（无二进制产物可 grep）：只查版本号 + HEAD/tag
# artifact = 会出二进制/包/dmg 的仓：必须在产物里 grep 到本次修订
IDENTITY_MODE=degraded

# artifact 模式必填：产物 glob，相对仓根（例如 "target/release/unirun"、"artifacts/*.dmg"）
# 找法要点：必须显式 `-f mp4` 那类教训的产物；glob 未命中即 FAIL
IDENTITY_ARTIFACT=""

# auto = 用 `git rev-parse --short HEAD`；也可写死一个构建时烘进产物的串
IDENTITY_NEEDLE=auto

# 版本号来源；留空则自动探测 package.json / Cargo.toml
VERSION_FILE=""
VERSION_FIELD=""

# ── P0-5 破坏性变更记录 ─────────────────────────────────────
# 门禁无法知道"这次改动是不是破坏性的"——它只校验记录本身是否合规。
# 每条空行分隔的条目必须含四个字段：
#   what: <改了什么>  affected: <受影响点数>  basis: <怎么量出来的>  migration: <一行迁移方法>
# 缺 basis 视为"未评估"→ FAIL（这是不变量本身，不是建议）
BREAKING_RECORD=""
REQUIRE_BREAKING_RECORD=0

# ── 扫描范围 ────────────────────────────────────────────────
# auto|always|never —— 是否扫历史提交里的密钥
# 历史里出现过的凭据必须轮换：改写历史不算修复
HISTORY_SCAN=auto
HISTORY_MAX_COMMITS=2000

# 0 = 关闭门禁自证（负向控制）。CI 里应打开；本地快速调试可关。
# 自证内容：注入假密钥/假 private/错修订必红，干净夹具与正确修订不误报。
SELF_TEST=1

# ── 白名单 / 附加判据 ───────────────────────────────────────
# 空格分隔的正则；命中即从泄漏结果里剔除。用于确认过的测试夹具。
# 例：ALLOW_PATTERNS="example\.invalid sk-test-000000000000000000000000"
ALLOW_PATTERNS=""

# 空格分隔的额外泄漏正则（本机主机名、私有域名等）
# 例：EXTRA_LEAK_PATTERNS="\bmyhost\.internal\b"
EXTRA_LEAK_PATTERNS=""

# 仓自带扩展点：存在则 source（可直接调 pr_ok/pr_fail/pr_warn/pr_na 之外的 report 函数）
# 默认 tools/publish-readiness.local.sh
LOCAL_HOOK=""


# ────────────────────────────────────────────────────────────
# 示例 A：Rust 单二进制工具仓（unirun/fmtguard/verify-gate 这一类的形状）
# ────────────────────────────────────────────────────────────
# PUBLISH_TARGET=1
# EXPECT_REMOTE=1
# EXPECT_VISIBILITY=public
# IDENTITY_MODE=artifact
# IDENTITY_ARTIFACT="target/release/unirun"
# BREAKING_RECORD="docs/BREAKING.md"
# REQUIRE_BREAKING_RECORD=1
#
# ────────────────────────────────────────────────────────────
# 示例 B：内部笔记/分析资产仓（dsfolder 这一类的形状）
# ────────────────────────────────────────────────────────────
# PUBLISH_TARGET=0
# REPO_DESC="内部笔记与调研资产，不是发布目标"
